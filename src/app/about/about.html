 <!-- Awards-->
            <section class="resume-section" id="about">
                <div class="resume-section-content">
                    <h2 class="mb-5">Registrar empleado</h2>
                    <ul class="fa-ul mb-0">
                        <p>Descripción del Proceso: Registrar proctos nuevos en la tabla “empledo”</p>
                    <p class="mb-0">Utilizar los servicos de Laravel</p>
        
       
            <div class="container">
                 <div class="mb-3">
                    <input [(ngModel)]="nuevoempleado.nombre" class="form-control mb-2" placeholder="Nombre">
                     <input [(ngModel)]="nuevoempleado.apellido" class="form-control mb-2" placeholder="apellido">
                     <input [(ngModel)]="nuevoempleado.correo" class="form-control mb-2"  placeholder="core">
                    <input [(ngModel)]="nuevoempleado.sueldo" class="form-control mb-2" type="number" placeholder="sueldo">
                     
                     <button (click)="crearempleado()" class="btn btn-primary">Guardar</button>
                 </div>
            </div>
